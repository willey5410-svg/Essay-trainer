<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英検1級 Essay Trainer</title>
<meta name="theme-color" content="#3459d6">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=1">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png?v=1">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=1">
<link rel="manifest" href="/manifest.webmanifest?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Essay Trainer">
<link rel="stylesheet" href="css/style.css?v=39">
<script>
  // 描画前にテーマを適用してちらつきを防ぐ
  (function () {
    try {
      var t = localStorage.getItem('et.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept="application/json" hidden>
<!-- ?v= はキャッシュバスター。テンプレート構造を変えるデプロイでは番号を上げること -->
<script src="js/templates.js?v=39"></script>
<script src="js/presets.js?v=39"></script>
<script src="js/gemini.js?v=39"></script>
<script src="js/app.js?v=39"></script>
</body>
</html>
